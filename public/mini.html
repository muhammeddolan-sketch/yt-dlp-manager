<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1f2937;
            color: #ffffff;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            -webkit-app-region: drag;
            cursor: pointer;
            border: 1px solid #374151;
        }
        body:hover {
            background: #273449;
        }
        .mini-btn {
            font-size: 11px; /* Smaller font */
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            -webkit-user-select: none;
            user-select: none;
            opacity: 0.9;
        }
        .mini-btn i {
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="mini-btn">
        <img src="icon.png" alt="UniGet" style="width: 18px; height: 18px; border-radius: 4px;">
        <span>UniGet</span>
    </div>
    <script>
        document.body.onclick = () => {
             if (window.unigetAPI) window.unigetAPI.openMain();
        };
    </script>
</body>
</html>
